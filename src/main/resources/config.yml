config-version: 4                        # Don't ever change this!

combat-log:
  # =========================
  # Core settings
  # =========================
  timer:
    duration-seconds: 15                 # Combat timer duration
    display: actionbar                   # actionbar | bossbar

  restrictions:
    elytra:
      disabled-in-combat: true
    teleporting:
      disabled-in-combat: false          # Disable any teleport while in combat
      allow-enderpearl: false            # Still allow Ender Pearls while teleporting is disabled
    mending:
      disabled-in-combat: true
    riptide:
      stop: false
      cooldown: 10000                    # riptide cooldown (ms)

  punishment:
    damage: 5.0                          # Damage penalty for restricted actions (0 = off)
    logout:
      mode: none                         # none | kill | commands
      commands: []                       # Console commands for mode "commands", {player} = player name
      # commands:
      #   - "clear {player}"
      #   - "tempban {player} 10m Combat logging"

  # =========================
  # Special triggers
  # =========================
  triggers:
    tag-mode: both                       # both | attacker | victim (who gets tagged when a player hits another player)
    start-below-health: 0                # Only start combat when the hit player drops to this health or lower (20 = full, 0 = always)
    enderpearl:
      set-combat-on-land: true           # Pearl on land triggers combat
      only-if-already-in-combat: false   # If false: pearl can start combat
    untag-on-kill: true
    explosions:
      set-combat-on-explosion: true      # End crystals + block explosions set combat

  # =========================
  # Exclusions / blocks
  # =========================
  ignored-worlds:
    - "ffa"                              # Worlds where combat timer is ignored

  command-restrictions:
    mode: blacklist                      # blacklist = block listed commands | whitelist = only allow listed commands
    commands:
      - "tpa"

  # =========================
  # Combat zone
  # =========================
  combat-zone:
    enabled: false
    radius: 10

  # =========================
  # Potion effects on combat tag
  # =========================
  tag-effects:
  # - type: SLOWNESS
  #   duration-seconds: 15
  #   amplifier: 0
  #   show-particles: true

  # =========================
  # WorldGuard integration
  # =========================
  worldguard:
    safe-zone-barrier:
      enabled: true                      # Show visual barrier at safe zone borders
      material: RED_STAINED_GLASS        # Any valid Material name (e.g. BARRIER, BLUE_STAINED_GLASS)
      radius: 1                          # Edge-detection thickness (in blocks), keep small
      view-distance: 8                   # How far from the border the barrier stays visible (in blocks)
      height: 3                          # How many blocks above the player the barrier scan checks

anti-kill-abuse:
  enabled: true

  limits:
    max-kills: 5                          # more than 5 kills = abuse
    remove-kill-after-seconds: 60         # kill removed from list after X seconds

  punish-commands:
    - "kick {killer} Kill-Abuse detected!"
    - "ban {killer}"