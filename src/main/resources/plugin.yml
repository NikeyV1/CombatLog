name: CombatLog
version: 1.16
main: de.nikey.combatLog.CombatLog
api-version: 1.21
authors: [ Nikey ]
website: https://github.com/NikeyV1
softdepend:
  - WorldGuard
  - PlaceholderAPI

commands:
  combatlog:
    description: CombatLog admin command
    usage: /combatlog <reload|status <player>|untag <player>>
    permission: combatlog.admin

permissions:
  combatlog.admin:
    description: Access to CombatLog admin commands
    default: op
  combatlog.bypass:
    description: Exempts the player from all CombatLog restrictions and tagging.
    default: op